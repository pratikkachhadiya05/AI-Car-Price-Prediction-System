<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="static\css\style.css">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <!-- hedaing -->
  <title>Car price predcter</title>
</head>

<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Car Price Predictor</h1>
    <!-- comnpany details -->

    <form action="/" method="POST" class="bg-light p-4 rounded shadow">
      <div class="form-group">
        <label for="companies">Company</label>
        <select class="form-control" id="companies" name="companies" required="1"
          onchange="load_car_models(this.id,'car_model')">
          <option value="">Select companies</option>
          {% for company in companies %}
          <option value="{{ company }}">{{ company }}</option>
          {% endfor %}
        </select>
      </div>
      <!-- car model details -->
      <div class="form-group">
        <label for="car_model">Car Model</label>
        <select class="form-control" id="car_model" name="car_model" required="1">
          <option value="">Select Car Model</option>
          {% for model in car_model %}
          <option value="{{ model }}">{{ model }}</option>
          {% endfor %}
        </select>

        <!-- year details -->
      </div class="form-group">
      <label for="years">Select year</label>
      <select class="form-control" id="year" name="year" required>
        <option value="">Select Year</option>
        {% for yr in years %}
        <option value="{{ yr }}" {% if selected.year==yr %}selected{% endif %}>
          {{ yr }}
        </option>
        {% endfor %}
      </select>
      <div>
        <br>


        <!-- kms driven details -->
        <div class="form-group">
          <label for="kms_driven">Kilometers Driven</label>
          <input type="number" class="form-control" id="kms_driven" name="kms_driven" placeholder="Enter kms driven"
            required>
        </div>
        <!-- fuel type details -->
        <div class="form-group">
          <label for="fuel_type">Fuel Type</label>
          <select class="form-control" id="fuel_type" name="fuel_type" required>
            <option value="">Select Fuel Type</option>
            {% for fuel in fuel_type %}
            <option value="{{ fuel }}">{{ fuel }}</option>
            {% endfor %}
          </select>
        </div>


        <button type="submit" class="btn btn-primary btn-block">Predict Price</button>

        {% if prediction %}
        <div class="alert alert-success mt-4 text-center">
          <h4>Predicted Price Car of {{selected['model']}}</h4>

          <h5><strong>₹ {{ prediction }}</strong></h5>
        </div>
        {% endif %}


    </form>
  </div>

  <script>
    function load_car_models(company_id, car_model_id) {
  var company = document.getElementById(company_id);
  var car_models = document.getElementById(car_model_id);

  // 🔹 Remove all previous options
  car_models.length = 0;

  // 🔹 Add default option every time
  var defaultOption = document.createElement("option");
  defaultOption.value = "";
  defaultOption.text = "Select Car Model";
  car_models.add(defaultOption);

  // 🔹 Wrapping in quotes & JSON.parse eliminates the "Property assignment expected" error line
  var companiesList = JSON.parse('{{ companies | tojson | safe }}');
  var carModelsList = JSON.parse('{{ car_model | tojson | safe }}');

  // 🔹 Pure JavaScript filtering
  companiesList.forEach(function(companyStr) {
    if (company.value === companyStr) {
      
      carModelsList.forEach(function(modelStr) {
        if (modelStr.startsWith(companyStr)) {
          var newoption = document.createElement("option");
          newoption.value = modelStr;
          newoption.text = modelStr;
          car_models.add(newoption);
        }
      });

    }
  });
}


  </script>

  <!-- Optional JavaScript -->
  <!-- jQuery first, then Popper.js, then Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
    integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
    integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
    crossorigin="anonymous"></script>
</body>

</html>
